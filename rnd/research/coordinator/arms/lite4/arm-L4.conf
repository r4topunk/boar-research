# LITE4 arm L4 (kit, v0.2 random20): cut 7 + tools/lite4.patch (deps.liteSourceBound) on the mini side tree be-0cfd4a77-cut7-lite4 (side dir be-repo-lite4/,
# adapter ff9d36b6…), Qwen3-1.7B Q4_K_M on b11010, --reasoning off, LITE_SOURCE_BOUND=1 (runner lite4-remote-run.sh arm L4).
# Requests = LITE2 l-kit-v02-s42-slice requests with runId/arm rewritten (arm.sh mkreq). Control L (OFF) = the LITE2 1.7B run l-kit-v02-s42-slice (reused, Haiku rows); 4B = dv-C-v02-s42.
ARM=cut7+lite4; LABEL=L4; TREE=cut7-lite4
REMOTE_RUNNER=lite4-remote-run.sh; REMOTE_ARM=L4; REMOTE_ARGS=noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'
RUN_PREFIX=l4-on-v02
SET=bench-v02; B=<private held-out dir>
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-lite4; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=lite4-L4
CONTROLS=("L|$B/runs-lite2|l-kit-v02-s{seed}-slice" "C|$B/runs-deepvpara|dv-C-v02-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=0
SMOKE_GATE=$CONF_DIR/../lite2/tools/gate.py
SMOKE_RUN=l4-smoke; SMOKE_REQ=$OUT_DIR/l4-smoke.requests.jsonl; SMOKE_DIR=$OUT_DIR
SLICE_RUN=l4-on-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../random20-v02.ids
CRITERION=$CONF_DIR/LITE4-criterion.md
PRECHECK_MARKERS="lite:"
export GATE_MODEL=qwen3-1.7b-q4km
