# LITE4 arm L4 on selftest20 (public pack self-tests; 0-call gate only, no judge): LITE2 l-st20-<pack>-s42 requests with runId/arm rewritten; control = LITE2 l-st20 traces.
ARM=cut7+lite4; LABEL=L4st; TREE=cut7-lite4
REMOTE_RUNNER=lite4-remote-run.sh; REMOTE_ARM=L4; REMOTE_ARGS=noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'
RUN_PREFIX=l4-on-st20
SET=selftest-lite2-st20
BENCH=$CONF_DIR/../lite2/bench-st20; QUESTIONS=-; JUDGED_IDS=$CONF_DIR/../lite2/selftest20.ids
OUT_DIR=$CONF_DIR/runs; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=lite4-st20-L4
CONTROLS=("Lst|$CONF_DIR/../lite2/runs|l-st20-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=0
SMOKE_GATE=$CONF_DIR/../lite2/tools/gate.py
CRITERION=$CONF_DIR/LITE4-criterion.md
PRECHECK_MARKERS="lite:"
export GATE_MODEL=qwen3-1.7b-q4km
