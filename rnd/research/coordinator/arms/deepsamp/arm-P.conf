# arm.conf for DEEPSAMP arm P (tree deepsamp = dt512 + sampler override via BOAR_SAMPLER_JSON; thinking 512, succinct, ctx 400). Criterion: ../DEEPSAMP-criterion.sha256
ARM=deepsamp; LABEL=P; TREE=deepsamp
REMOTE_RUNNER=deepsamp-remote-run.sh; REMOTE_ARM=P
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-q2kxl"}'
RUN_PREFIX=ds-P-vpara
SET=V-para; B=<private held-out dir>
BENCH=$B/bench-shim; QUESTIONS=$B/items.jsonl; JUDGED_IDS=$B/runs-cut6/judged.ids
OUT_DIR=$B/runs-deepsamp; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=deepsamp-P
CONTROLS=("H|$B/runs-dt512|dh-H-vpara-s{seed}" "D|$B/runs-deepvpara|dv-D-vpara-s{seed}" "K|$B/runs-cut6|cut6-vpara-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=1; GATE_MAX=522
K=<workspace>/boar-eval/runs/kiln/deepsamp
SMOKE_RUN=ds-smoke-P; SMOKE_REQ=$K/ds-smoke-P.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=ds-P-vpara-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../signal20-vpara.ids
