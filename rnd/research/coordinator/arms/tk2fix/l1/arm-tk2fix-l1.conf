# TK2FIX-L1 conf: used only for smoke + crit_check of TK2FIX-L1-criterion.md (generation l1/tools/gen.sh, judge l1/tools/judge.sh).
ARM=tk2fix-cut7; LABEL=TK2FIXL1; TREE=cut7-tk2fix
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'
RUN_PREFIX=tk2fix-l1
SET=selftest-180
BENCH=<workspace>/boar-eval/bench/selftest/boar-factbook; QUESTIONS=-; JUDGED_IDS=-
OUT_DIR=$CONF_DIR/runs; AGG_DIR=$CONF_DIR/../aggregates
JUDGE_SYSTEM=selftest-tk2fix-l1
CONTROLS=("S|$CONF_DIR/../../packs/selftest-runs|st-boar-factbook-cut7-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=0
CRITERION=$CONF_DIR/../TK2FIX-L1-criterion.md
