# arm.conf for VITALPACK-ADD (arm A: dt512 tree + vitaladd.vs-dt512.patch; one wiki-vital5 intro appended after grounding, k 1 pool 6). v0.2 first. Criterion: VITALADD-criterion.md
ARM=vitaladd                  # written to config.arm of every request (tree ARM file = vitaladd)
LABEL=A
TREE=vitaladd                 # mini tree <runner>/kiln/be-0cfd4a77-$TREE
REMOTE_RUNNER=vitaladd-remote-run.sh
REMOTE_ARM=D; REMOTE_ARGS=noplaces   # v0.2: noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-q2kxl","addPack":{"id":"wiki-vital5","k":1,"pool":6}}'
RUN_PREFIX=va-A-v02
SET=bench-v02; B=<private held-out dir>
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-vitaladd; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=vitaladd-A
CONTROLS=("H|$B/runs-dt512v02|dhv-H-v02-s{seed}" "K|$B/runs-cut6|cut6-v02-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512
GATE_MIN=1; GATE_MAX=522
SMOKE_GATE=$CONF_DIR/tools/smoke_gate.py
K=<workspace>/boar-eval/runs/kiln/vitaladd
SMOKE_RUN=va-smoke-A; SMOKE_REQ=$K/va-smoke-A.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=va-A-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../random20-v02.ids
CRITERION=$CONF_DIR/VITALADD-criterion.md

# precheck (2026-10-11): settings-derived reasonCode markers present only when the arm setting is active
PRECHECK_MARKERS="addpack:"
