# arm.conf for DEEPCOVER (arm C: dt512 tree + deepcover.vs-dt512.patch 180adac4…; key-point instruction + cap 300). v0.2 first. Criterion: DEEPCOVER-criterion.md
ARM=deepcover                 # tree ARM file = deepcover
LABEL=C
TREE=deepcover
REMOTE_RUNNER=deepcover-remote-run.sh
REMOTE_ARM=D; REMOTE_ARGS=noplaces   # v0.2: noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-q2kxl","deepCover":true}'
RUN_PREFIX=dc-C-v02
SET=bench-v02; B=<private held-out dir>
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-deepcover; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=deepcover-C
CONTROLS=("H|$B/runs-dt512v02|dhv-H-v02-s{seed}" "K|$B/runs-cut6|cut6-v02-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512
GATE_MIN=1; GATE_MAX=522
SMOKE_GATE=$CONF_DIR/tools/smoke_gate.py
K=<workspace>/boar-eval/runs/kiln/deepcover
SMOKE_RUN=dc-smoke-C; SMOKE_REQ=$K/dc-smoke-C.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=dc-C-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../random20-v02.ids
CRITERION=$CONF_DIR/DEEPCOVER-criterion.md

# precheck (2026-10-11): settings-derived reasonCode markers present only when the arm setting is active
PRECHECK_MARKERS="deepcover:"
