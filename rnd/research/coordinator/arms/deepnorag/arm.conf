# arm.conf for DEEPNORAG (arm N: DT512 config with config.kit = []; diagnostic). Criterion: ../DEEPNORAG-criterion.sha256
ARM=dt512                     # written to config.arm of every request
LABEL=N                       # short arm name in paired/aggregate files and rule text
TREE=dt512                    # mini tree suffix: <runner>/kiln/be-0cfd4a77-$TREE
REMOTE_RUNNER=dt512-remote-run.sh
REMOTE_ARM=D                  # arg 2 of the mini runner (D = adds --deep-model qwen); REMOTE_ARGS="noplaces" for v0.2
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-q2kxl"}'
RUN_PREFIX=dn-N-vpara         # run ids = $RUN_PREFIX-s<seed>[-slice]
SET=V-para; B=<private held-out dir>
BENCH=$B/bench-shim; QUESTIONS=$B/items.jsonl; JUDGED_IDS=$B/runs-cut6/judged.ids
OUT_DIR=$B/runs-deepnorag; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=deepnorag-N          # judge.mjs --system = $JUDGE_SYSTEM-haiku55-low | -opus
# controls: name|dir|basename ({seed}); first = L1 control (Haiku rows, seed $L1_SEED) and per-category pair; all get scales + paired_gap
CONTROLS=("H|$B/runs-dt512|dh-H-vpara-s{seed}${SLICE_SUFFIX:-}")   # SLICE_SUFFIX=-slice for the slice stage (control = DT512 slice rows)
# rule: PROMOTE (always) = wins >= ctl+PROMOTE_WINS or dRatio >= PROMOTE_D; CHEAPER/PARITY = "dmin time_ratio" (dRatio >= -dmin and arm p50 <= ratio x control p50)
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512
GATE_MIN=1; GATE_MAX=522      # smoke gate: 0 < reasoning <= 522 (budget 512 + message)
K=<workspace>/boar-eval/runs/kiln/deepnorag
SMOKE_RUN=dn-smoke-N; SMOKE_REQ=$K/dn-smoke-N.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=dn-N-vpara-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../signal20-vpara.ids
