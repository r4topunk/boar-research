# LITE5-180 conf: used only for smoke + crit_check of LITE5-180-criterion.md (generation via tools/gen_180.sh, judge via tools/judge_180.sh). Rest copied from arm-st-L5.conf.
# Control = LITE2 1.7B l-st20 rows (mini). Judge bench = lite2/bench-st20.
ARM=cut7-headpass-x2; LABEL=L5x180; TREE=cut7-headpass-x2
SETTINGS='{"quickFirst":true,"alwaysComplete":false,"packHeadPass":"a2","packDense2":"append-budget"}'
RUN_PREFIX=lite5-180-on
SET=selftest-lite2-st20
BENCH=$CONF_DIR/../lite2/bench-st20; QUESTIONS=-; JUDGED_IDS=$CONF_DIR/../lite2/selftest20.ids
OUT_DIR=$CONF_DIR/runs; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=lite5-st20-L5
CONTROLS=("Lst|$CONF_DIR/../lite2/runs|l-st20-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=0
CRITERION=$CONF_DIR/LITE5-180-criterion.md
export GATE_MODEL=qwen3-1.7b-q4km
