# arm.conf for THINK4B arm ZV = Z (thinking 4B, FAST_THINKING_BUDGET 512, tree think4b512) on v0.2 (noplaces, as the claim's Run A). Criterion: ../THINK4B-V02-criterion.sha256
ARM=think4b512; LABEL=ZV; TREE=think4b512
REMOTE_RUNNER=think4b-remote-run.sh; REMOTE_ARM=Z; REMOTE_ARGS=noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'   # = the claim runs' and C's settings
RUN_PREFIX=t4-ZV-v02
SET=bench-v02; B=<private held-out dir>
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-think4b; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=think4bv02-ZV
# L1 control = C on v0.2 (DEEPVPARA stage 2, same backend, Haiku rows 110 ids); L2 scales use arm-ZV-l2.conf (K = claim rows, Opus)
CONTROLS=("K|$B/runs-cut6|cut6-v02-s{seed}" "D|$B/runs-deepvpara|dv-D-v02-s{seed}")   # L2: claim rows (Opus) first, deep tier for the ladder
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=1; GATE_MAX=522; SMOKE_GATE=$CONF_DIR/tools/gate.py
K=<workspace>/boar-eval/runs/kiln/think4b
SMOKE_RUN=t4-smoke-Z; SMOKE_REQ=$K/t4-smoke-Z.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=t4-ZV-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../signal20-v02.ids
