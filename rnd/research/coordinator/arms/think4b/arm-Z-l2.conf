# arm.conf for THINK4B arm Z (tree think4b512: cut 6, fast model Qwen3-4B-Thinking-2507 Q4_K_M, FAST_THINKING_BUDGET 512). Criterion: ../THINK4B-criterion.sha256
ARM=think4b512; LABEL=Z; TREE=think4b512
REMOTE_RUNNER=think4b-remote-run.sh; REMOTE_ARM=Z
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'   # = the claim runs' and C's settings
RUN_PREFIX=t4-Z-vpara
SET=V-para; B=<private held-out dir>
BENCH=$B/bench-shim; QUESTIONS=$B/items.jsonl; JUDGED_IDS=$B/runs-cut6/judged.ids
OUT_DIR=$B/runs-think4b; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=think4b-Z
# L1 control = C (DEEPVPARA same-backend 4B instruct, Haiku rows s42/s43); L2 scales use arm-Z-l2.conf (K = claim rows, Opus)
CONTROLS=("K|$B/runs-cut6|cut6-vpara-s{seed}" "D|$B/runs-deepvpara|dv-D-vpara-s{seed}")   # L2: claim rows (Opus) first, deep tier for the ladder
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=1; GATE_MAX=522; SMOKE_GATE=$CONF_DIR/tools/gate.py
K=<workspace>/boar-eval/runs/kiln/think4b
SMOKE_RUN=t4-smoke-Z; SMOKE_REQ=$K/t4-smoke-Z.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=t4-Z-vpara-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../signal20-vpara.ids
