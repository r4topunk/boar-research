# arm.conf for THINK4B arm Y (tree think4b: cut 6, fast model Qwen3-4B-Thinking-2507 Q4_K_M, FAST_THINKING_BUDGET 256). Criterion: ../THINK4B-criterion.sha256
ARM=think4b; LABEL=Y; TREE=think4b
REMOTE_RUNNER=think4b-remote-run.sh; REMOTE_ARM=Y
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'   # = the claim runs' and C's settings
RUN_PREFIX=t4-Y-vpara
SET=V-para; B=<private held-out dir>
BENCH=$B/bench-shim; QUESTIONS=$B/items.jsonl; JUDGED_IDS=$B/runs-cut6/judged.ids
OUT_DIR=$B/runs-think4b; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=think4b-Y
# L1 control = C (DEEPVPARA same-backend 4B instruct, Haiku rows s42/s43); L2 scales use arm-Y-l2.conf (K = claim rows, Opus)
CONTROLS=("C|$B/runs-deepvpara|dv-C-vpara-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=256; GATE_MIN=1; GATE_MAX=266; SMOKE_GATE=$CONF_DIR/tools/gate.py
K=<workspace>/boar-eval/runs/kiln/think4b
SMOKE_RUN=t4-smoke-Y; SMOKE_REQ=$K/t4-smoke-Y.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=t4-Y-vpara-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../signal20-vpara.ids
