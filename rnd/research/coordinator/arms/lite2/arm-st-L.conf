# LITE2 arm L on selftest20 (public pack self-tests, 2 per pack + 2): cut 7 + claim kit + the item's pack (SELFTEST-SCORES requests, modelId -> qwen3-1.7b-q4km; tools/build_st20.py).
# Control C4B = the 4B with-pack rows of SELFTEST-SCORES (MacBook kiln-local, 2026-10-13) filtered to the 20 ids (runs/c4b-st20-s42.*). Judge bench = bench-st20/ (merged, verbatim lines).
ARM=cut7; LABEL=Lst; TREE=cut7
REMOTE_RUNNER=lite2-remote-run.sh; REMOTE_ARM=L; REMOTE_ARGS=noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'
RUN_PREFIX=l-st20
SET=selftest-lite2-st20
BENCH=$CONF_DIR/bench-st20; QUESTIONS=-; JUDGED_IDS=$CONF_DIR/selftest20.ids
OUT_DIR=$CONF_DIR/runs; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=lite2-st20-L
CONTROLS=("C4B|$CONF_DIR/runs|c4b-st20-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=0
SMOKE_GATE=$CONF_DIR/tools/gate.py
SLICE_RUN=l-st20-s42; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/selftest20.ids
CRITERION=$CONF_DIR/LITE2-criterion.md
export GATE_MODEL=qwen3-1.7b-q4km
