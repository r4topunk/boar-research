# LITE2 arm L (kit, v0.2 random20): cut 7 tree + side dir be-repo-lite2/ (tools/adapter-lite2.patch), fast model qwen3-1.7b-q4km on the standard b11010 llama-server, --reasoning off.
# Requests = t2-kit-v02-s42-slice requests (= dv-C-v02-s42 slice requests with modelId swapped) with modelId -> qwen3-1.7b-q4km (tools/mkreq_swap.py). Control = dv-C-v02-s42 (4B) Haiku rows.
ARM=cut7; LABEL=L; TREE=cut7
REMOTE_RUNNER=lite2-remote-run.sh; REMOTE_ARM=L; REMOTE_ARGS=noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'
RUN_PREFIX=l-kit-v02
SET=bench-v02; B=<private held-out dir>
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-lite2; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=lite2-L
CONTROLS=("C|$B/runs-deepvpara|dv-C-v02-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=0
SMOKE_GATE=$CONF_DIR/tools/gate.py
SMOKE_RUN=l-smoke; SMOKE_REQ=$OUT_DIR/l-smoke.requests.jsonl; SMOKE_DIR=$OUT_DIR
SLICE_RUN=l-kit-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../random20-v02.ids
CRITERION=$CONF_DIR/LITE2-criterion.md
export GATE_MODEL=qwen3-1.7b-q4km
