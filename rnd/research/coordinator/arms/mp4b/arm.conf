# arm.conf for MP4B (arm M: the engine's own multi-pass decompose -> research -> synthesize on the 4B cut 7, MacBook). Criterion: ../deepiter/DEEPITER-criterion.md (shared with DEEPITER).
# Generation is LOCAL (tools/local-run.sh), not via arm.sh launch/wait/fetch: use REPLAY=1 with l1/scales.
ARM=cut7                      # must equal the tree ARM file (adapter check); LABEL distinguishes the arm
LABEL=M
TREE=cut7-local
REMOTE_RUNNER=none; REMOTE_ARM=C; REMOTE_ARGS=noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":true}'
RUN_PREFIX=mp-M-v02
SET=bench-v02; B=<private held-out dir>
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-mp4b; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=mp4b-M
CONTROLS=("C|$B/runs-deepvpara|dv-C-v02-s{seed}" "K|$B/runs-cut6|cut6-v02-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=100000
SMOKE_GATE=$CONF_DIR/tools/gate.py
K=<workspace>/boar-eval/runs/kiln/mp4b
SMOKE_RUN=mp-smoke-M; SMOKE_REQ=$K/mp-smoke-M.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=mp-M-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../random20-v02.ids
CRITERION=$CONF_DIR/../deepiter/DEEPITER-criterion.md
