# arm.conf for GEMMATHINK (arm G: gemmathink tree, Gemma 4 26B-A4B deep model + thinking). Reproduces gemmathink/tools/{gt,l1,l2}.sh. Criterion 46e058d3...
ARM=gemmathink
LABEL=G
TREE=gemmathink
REMOTE_RUNNER=gemmathink-remote-run.sh
REMOTE_ARM=G                  # the mini runner adds --deep-model gemma-4-26b-a4b-ud-q2kxl and BOAR_THINK_KWARG=1 for G
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"gemma-4-26b-a4b-ud-q2kxl"}'
RUN_PREFIX=gt-G-vpara
SET=V-para; B=<private held-out dir>
BENCH=$B/bench-shim; QUESTIONS=$B/items.jsonl; JUDGED_IDS=$B/runs-cut6/judged.ids
OUT_DIR=$B/runs-gemmathink; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=gemmathink-G
CONTROLS=("T|$B/runs-deepthink|dt-T-vpara-s{seed}" "D|$B/runs-deepvpara|dv-D-vpara-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY="0.03 0.75"     # parity-faster: dRatio >= -0.03 and p50 <= 0.75 x T
THINK_HIT=1024
GATE_MIN=1; GATE_MAX=1100     # Gemma smoke reasoning 576 / 1033 (1024 + budget message)
K=<workspace>/boar-eval/runs/kiln/gemmathink
SMOKE_RUN=gt-smoke-G; SMOKE_REQ=$K/gt-smoke-G.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=gt-G-vpara-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../signal20-vpara.ids
