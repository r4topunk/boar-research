# arm.conf for QUANTCEIL (arm Q: dt512 tree + deep model UD-IQ3_XXS instead of UD-Q2_K_XL; identified by settings.deepModelId + run prefix). v0.2 first. Criterion: QUANTCEIL-criterion.md
ARM=dt512                     # tree ARM file = dt512 (unchanged tree)
LABEL=Q
TREE=dt512
REMOTE_RUNNER=quantceil-remote-run.sh
REMOTE_ARM=D; REMOTE_ARGS=noplaces   # v0.2: noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-iq3xxs"}'
RUN_PREFIX=qc-Q-v02
SET=bench-v02; B=<private held-out dir>
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-quantceil; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=quantceil-Q
CONTROLS=("H|$B/runs-dt512v02|dhv-H-v02-s{seed}" "K|$B/runs-cut6|cut6-v02-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512
GATE_MIN=1; GATE_MAX=522
SMOKE_GATE=$CONF_DIR/tools/smoke_gate.py
K=<workspace>/boar-eval/runs/kiln/quantceil
SMOKE_RUN=qc-smoke-Q2; SMOKE_REQ=$K/qc-smoke-Q2.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=qc-Q-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../random20-v02.ids
CRITERION=$CONF_DIR/QUANTCEIL-criterion.md

# precheck (2026-10-11): settings-derived reasonCode markers present only when the arm setting is active
PRECHECK_MARKERS="generate:deep-model-qwen3.6-35b-a3b-ud-iq3xxs"
