# LITE7 conf: used only for smoke + crit_check of LITE7-criterion-v2.md (generation via tools/gen_lite7.sh, judge via tools/judge_lite7.sh).
ARM=cut7+lite7; LABEL=L7; TREE=cut7-lite7
SETTINGS='{"quickFirst":true,"alwaysComplete":false,"packHeadPass":"a2","packDense2":"append-budget"}'
RUN_PREFIX=lite7-180-on
SET=selftest-180
BENCH=<workspace>/boar-eval/bench/selftest; QUESTIONS=-; JUDGED_IDS=-
OUT_DIR=$CONF_DIR/runs; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=lite7-L7
CONTROLS=()
CRITERION=$CONF_DIR/LITE7-criterion-v2.md
export GATE_MODEL=qwen3-1.7b-q4km
