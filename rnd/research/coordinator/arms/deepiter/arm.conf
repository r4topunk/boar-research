# arm.conf for DEEPITER (arm I: dt512 tree + deepiter.vs-dt512.patch a83bead8…, deep Qwen + thinking 512 + planner follow-up searches). v0.2 first. Criterion: DEEPITER-criterion.md (coordinator)
ARM=deepiter                  # written to config.arm of every request
LABEL=I                       # short arm name in paired/aggregate files and rule text
TREE=deepiter                 # mini tree suffix: <runner>/kiln/be-0cfd4a77-$TREE
REMOTE_RUNNER=deepiter-remote-run.sh
REMOTE_ARM=D; REMOTE_ARGS=noplaces   # arg 2 of the mini runner (D = adds --deep-model qwen); noplaces for v0.2
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-q2kxl","deepIterFollowups":2}'
RUN_PREFIX=di-I-v02           # run ids = $RUN_PREFIX-s<seed>[-slice]
SET=bench-v02; B=<private held-out dir>
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-deepiter; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=deepiter-I       # judge.mjs --system = $JUDGE_SYSTEM-haiku55-low | -opus
# controls: name|dir|basename ({seed}); first = L1 control (Haiku rows, seed $L1_SEED) and per-category pair; all get scales + paired_gap
CONTROLS=("H|$B/runs-dt512v02|dhv-H-v02-s{seed}" "K|$B/runs-cut6|cut6-v02-s{seed}")
# rule: PROMOTE (always) = wins >= ctl+PROMOTE_WINS or dRatio >= PROMOTE_D; CHEAPER/PARITY = "dmin time_ratio" (dRatio >= -dmin and arm p50 <= ratio x control p50)
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER="0.03 0.7"; PARITY=""
THINK_HIT=512                 # thinking budget of this tree (dt512's own conf kept 1024 only to reproduce frozen aggregates)
GATE_MIN=1; GATE_MAX=522      # smoke gate: 0 < reasoning <= 522 (budget 512 + message; the planner runs with thinking off)
K=<workspace>/boar-eval/runs/kiln/deepiter
SMOKE_RUN=di-smoke-I; SMOKE_REQ=$K/di-smoke-I.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=di-I-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../random20-v02.ids
CRITERION=DEEPITER-criterion.md
