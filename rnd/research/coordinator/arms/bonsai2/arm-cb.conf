# T-cb vs C-cb (closed-book): runner arm T, control = the c-cb slice run. Derived from arm.conf.
# arm.conf for BONSAI2 S1 (arm T: cut 7 tree + side dir be-repo-bonsai2/ (adapter-bonsai2.patch a65e4c69…), fast model bonsai2-4b-ptq1_0 on the
# PrismML fork llama-server; identified by config.modelId + run prefix). Requests for T-kit = C's s42 requests with modelId changed (jq pass; mkreq does not).
# Launchable 2026-10-15 22:1x: scoped script-only blind exception (coordinator 22:0x) + runner T exports --reasoning off. C-cb: arm-C.conf; T-cb L1: arm-cb.conf.
ARM=cut7                      # tree ARM file = cut7
LABEL=Tcb
TREE=cut7
REMOTE_RUNNER=bonsai2-remote-run.sh
REMOTE_ARM=T; REMOTE_ARGS=noplaces   # v0.2: noplaces (C-cb uses REMOTE_ARM=C: a second conf or an override)
SETTINGS='{"quickFirst":true,"alwaysComplete":false}'   # = the claim runs' and C's settings (think4b/arm-ZV.conf)
RUN_PREFIX=t-cb-v02
SET=bench-v02; B=<private held-out dir>     # coordinator's call: every v0.2 input below lives under blind/
BENCH=$B/live/v0.2; QUESTIONS=$B/live/v0.2/questions.v02-new.jsonl; JUDGED_IDS=$B/runs-deepvpara/judged.ids
OUT_DIR=$B/runs-bonsai2; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=bonsai2-Tcb
CONTROLS=("Ccb|$OUT_DIR|c-cb-v02-s{seed}-slice")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=0
SMOKE_GATE=$CONF_DIR/tools/gate.py
K=$OUT_DIR   # smoke holds 2 slice items: keep it under blind/, not in boar-eval git
SMOKE_RUN=b2-smoke-T; SMOKE_REQ=$K/b2-smoke-T.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=t-cb-v02-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../random20-v02.ids
CRITERION=$CONF_DIR/BONSAI2-S1-criterion.md   # frozen, sha in BONSAI2-S1-criterion.sha256
