# arm.conf for DEEPWIKI (arm W: dt512 tree + the enwiki top-100k pack in config.kit; thinking 512, succinct, ctx 400). Criterion: ../DEEPWIKI-criterion.sha256
ARM=dt512                     # config.arm must match the tree's ARM; the arm is identified by config.kit + run prefix
LABEL=W; TREE=dt512
REMOTE_RUNNER=dt512-remote-run.sh; REMOTE_ARM=D
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-q2kxl"}'
RUN_PREFIX=dw-W-vpara
SET=V-para; B=<private held-out dir>
BENCH=$B/bench-shim; QUESTIONS=$B/items.jsonl; JUDGED_IDS=$B/runs-cut6/judged.ids
OUT_DIR=$B/runs-deepwiki; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=deepwiki-W
CONTROLS=("H|$B/runs-dt512|dh-H-vpara-s{seed}" "D|$B/runs-deepvpara|dv-D-vpara-s{seed}" "K|$B/runs-cut6|cut6-vpara-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=1; GATE_MAX=522
K=<workspace>/boar-eval/runs/kiln/deepwiki
SMOKE_RUN=dw-smoke-W; SMOKE_REQ=$K/dw-smoke-W.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=dw-W-vpara-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../signal20-vpara.ids
