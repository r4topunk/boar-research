# arm.conf for DT256 (arm Q: dt256 tree, deep Qwen + thinking budget 256). Criterion: ../DT256-criterion.sha256
ARM=dt256                     # written to config.arm of every request
LABEL=Q                       # short arm name in paired/aggregate files and rule text
TREE=dt256                    # mini tree suffix: <runner>/kiln/be-0cfd4a77-$TREE
REMOTE_RUNNER=dt256-remote-run.sh
REMOTE_ARM=D                  # arg 2 of the mini runner (D = adds --deep-model qwen); REMOTE_ARGS="noplaces" for v0.2
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-q2kxl"}'
RUN_PREFIX=dq-Q-vpara         # run ids = $RUN_PREFIX-s<seed>[-slice]
SET=V-para; B=<private held-out dir>
BENCH=$B/bench-shim; QUESTIONS=$B/items.jsonl; JUDGED_IDS=$B/runs-cut6/judged.ids
OUT_DIR=$B/runs-dt256; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=dt256-Q          # judge.mjs --system = $JUDGE_SYSTEM-haiku55-low | -opus
# controls: name|dir|basename ({seed}); first = L1 control (Haiku rows, seed $L1_SEED) and per-category pair; all get scales + paired_gap
CONTROLS=("T|$B/runs-deepthink|dt-T-vpara-s{seed}" "H|$B/runs-dt512|dh-H-vpara-s{seed}" "D|$B/runs-deepvpara|dv-D-vpara-s{seed}")
# rule: PROMOTE (always) = wins >= ctl+PROMOTE_WINS or dRatio >= PROMOTE_D; CHEAPER/PARITY = "dmin time_ratio" (dRatio >= -dmin and arm p50 <= ratio x control p50)
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER="0.03 0.5"; PARITY=""
THINK_HIT=256
GATE_MIN=1; GATE_MAX=266      # smoke gate: 0 < reasoning <= 522 (budget 512 + message)
K=<workspace>/boar-eval/runs/kiln/dt256
SMOKE_RUN=dq-smoke-Q; SMOKE_REQ=$K/dq-smoke-Q.requests.jsonl; SMOKE_DIR=$K
SLICE_RUN=dq-Q-vpara-s42-slice; SLICE_REQ=$OUT_DIR/$SLICE_RUN.requests.jsonl; SLICE_IDS=$CONF_DIR/../signal20-vpara.ids
