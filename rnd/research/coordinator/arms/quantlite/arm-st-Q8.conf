# QUANTLITE arm Q8 on selftest20: Qwen3-1.7B Q8_0 + X2b on the mini (X2b tree copy, adapter-quantlite.ts); traces fetched locally (REPLAY=1).
# Control = LITE5 Q4 + X2b rows (MacBook). Judge bench = lite2/bench-st20.
ARM=cut7-headpass-x2; LABEL=Q8st; TREE=cut7-headpass-x2
SETTINGS='{"quickFirst":true,"alwaysComplete":false,"packHeadPass":"a2","packDense2":"append-budget"}'
RUN_PREFIX=quantlite-q8-st20
SET=selftest-lite2-st20
BENCH=$CONF_DIR/../lite2/bench-st20; QUESTIONS=-; JUDGED_IDS=$CONF_DIR/../lite2/selftest20.ids
OUT_DIR=$CONF_DIR/runs; AGG_DIR=$CONF_DIR/aggregates
JUDGE_SYSTEM=quantlite-st20-Q8
CONTROLS=("Q4X|$CONF_DIR/../lite5/runs|lite5-on-st20-s{seed}")
PROMOTE_WINS=3; PROMOTE_D=0.03; CHEAPER=""; PARITY=""
THINK_HIT=512; GATE_MIN=0; GATE_MAX=0
CRITERION=$CONF_DIR/QUANTLITE-criterion.md
export GATE_MODEL=qwen3-1.7b-q8_0
