LABEL=E
TREE=deephedge
REMOTE_RUNNER=deephedge-remote-run.sh
REMOTE_ARM=D; REMOTE_ARGS=noplaces   # v0.2: noplaces
SETTINGS='{"quickFirst":true,"alwaysComplete":true,"deepModelId":"qwen3.6-35b-a3b-ud-q2kxl","deepHedge":true}'
